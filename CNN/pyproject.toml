[project]
name = "CNN"
version = "0.1.0"

requires-python = ">=3.12, <3.13"

dependencies = [
    "opencv-python>=4.13,<5",
    "ipykernel>=7.3.0",
    "keras>=3.15.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
